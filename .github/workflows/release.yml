name: Release

# On a semver tag: build the single-file viewer, attach it to a GitHub release,
# and publish it to GitHub Pages. To re-publish an existing tag, run this
# manually and pick the tag under "Use workflow from".
on:
  push:
    tags: ['v*.*.*'] # loose glob; the version step does the real validation
  workflow_dispatch:

# One Pages deployment at a time, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    outputs:
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json

      # After pnpm, so the cache backend can find the store. Keyed on the lockfile.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      - name: Derive the version
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::run this workflow from a tag, not '$TAG'"
            exit 1
          fi

          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' is not a semver version"
            exit 1
          fi

          # A tag that disagrees with package.json is usually a mistake, but not
          # worth failing a release over: the tag is what people cite.
          pkg=$(node -p "require('./package.json').version")
          if [ "$pkg" != "$version" ]; then
            echo "::warning::tag is $version but package.json says $pkg"
          fi

          # 1.2.3-rc.1 and friends are prereleases.
          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac

          {
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      # build/ holds just index.html, which is the whole site.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.v.outputs.version }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it alone"
            exit 0
          fi
          asset="signalviewer-${VERSION}.html"
          cp build/index.html "$asset"
          flags=(--generate-notes --verify-tag)
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" "$asset" --title "Signal Viewer $VERSION" "${flags[@]}"

  # Prereleases get a GitHub release but leave the live site alone.
  deploy:
    needs: build
    if: needs.build.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write    # deploy to Pages
      id-token: write # prove the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
